# AR488 -> VXI-11 gateway configuration (installed as /etc/ar488-vxi11.toml)
#
# Each [[interface]] is one AR488 adapter = one GPIB bus. Clients address
# instruments as  TCPIP::<pi>::<name>,<gpib address>::INSTR
#
# Adapters are found by the name stored in them, so any USB socket works.
# To name an adapter, send it  ++id name gpib0  then  ++savecfg  (once).
# An adapter can instead be pinned to a port with  port = "/dev/serial/..."
# (it is still refused if it reports a different stored name).
# With no [[interface]] entries at all, every AR488 found is used: named ones
# under their stored name, unnamed ones as the next free gpibN.

[server]
log_level = "INFO"      # DEBUG logs every command/response
# fifo_hold_s = 1.0     # several clients on one instrument: a client keeps the
#                       # instrument until it has read its answer, or for this
#                       # long after a command it reads nothing back for. 0 = off

[[interface]]
name = "gpib0"          # Nano clone (CH340): Keithley 2000

[[interface]]
name = "gpib1"          # Nano original (FTDI AC008SFE): HP 3245A, HP 3456A
no_eoi = [9]            # HP 3245A: no EOI on replies unless sent "END ON"

[[interface]]
name = "gpib2"          # Nano clone (CH340): Agilent 54624A

# Optional per-interface settings:
# port = "/dev/serial/by-id/..."  # fixed port instead of finding it by name
# baud = 500000         # default: found automatically (500000, then 115200)
# reset_delay = 2.5     # seconds to wait after opening (Arduino resets on open)
# ifc_on_open = true    # pulse IFC when the adapter is opened
# no_eoi = [9, 22]      # addresses that never assert EOI on replies; their reads
#                       # end after no_eoi_tmo_ms of silence instead
# no_eoi_tmo_ms = 200
# auto_no_eoi = true    # detect such instruments automatically (first read ~3 s)

# Web interface (monitoring, settings, console, logger). Defaults shown.
# Settings changed on the web page are stored in /var/lib/ar488-vxi11/state.json
# and take precedence over this file; the Settings page can reset them.
# [web]
# enabled = true
# port = 8080
# bind = "0.0.0.0"
